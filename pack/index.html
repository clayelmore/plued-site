<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/pack/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your store\u2019s own produce codes, ready to add to the PLUed app. Free, no account needed.">

  <!-- Link preview. A shared pack link (plued.app/p/<id>) redirects here, so
       these tags are what iMessage, WhatsApp, Slack and LinkedIn show. They
       shipped as the Flutter template defaults ("A new Flutter project")
       until 2026-09-01 — every trainer sharing a pack sent that card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PLUed">
  <meta property="og:title" content="A PLUed Store Pack">
  <meta property="og:description" content="Your store\u2019s own produce codes, ready to add to the PLUed app. Open on your phone to add them.">
  <meta property="og:url" content="https://plued.app/pack/">
  <meta property="og:image" content="https://plued.app/assets/img/og_card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A PLUed Store Pack">
  <meta name="twitter:description" content="Your store\u2019s own produce codes, ready to add to the PLUed app.">
  <meta name="twitter:image" content="https://plued.app/assets/img/og_card.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plued_store_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PLUed Store Pack Builder</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
