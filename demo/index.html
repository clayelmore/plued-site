<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Learn produce PLU codes. Play PLUzzle, the free daily produce puzzle, right in your browser.">

  <!-- plued.app/play and /browse redirect here, so these are the tags every
       shared link unfurls with. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PLUed">
  <meta property="og:title" content="PLUzzle - the daily produce puzzle">
  <meta property="og:description" content="One produce item a day. Six tries to get the code. Free forever, no account. Play it in your browser.">
  <meta property="og:url" content="https://plued.app/play/">
  <meta property="og:image" content="https://plued.app/assets/img/og_card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PLUzzle - the daily produce puzzle">
  <meta name="twitter:description" content="One produce item a day. Six tries to get the code. Free forever, no account.">
  <meta name="twitter:image" content="https://plued.app/assets/img/og_card.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PLUed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PLUed</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
